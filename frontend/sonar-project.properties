# Analisis estatico del frontend con el escaner generico de SonarQube.
#
# El backend NO usa este archivo: los proyectos de .NET se analizan con
# dotnet-sonarscanner, que toma sus parametros de la linea de comandos porque
# necesita envolver la compilacion (ver docs/analisis-estatico-sonarqube.md).
#
#   docker run --rm --network host -v "${PWD}:/usr/src" \
#     -e SONAR_TOKEN sonarsource/sonar-scanner-cli

sonar.projectKey=gsp-frontend
sonar.projectName=Gestion de Servicios Profesionales - Frontend
sonar.host.url=http://localhost:9000

sonar.sources=app,src
sonar.sourceEncoding=UTF-8

# tests/ son las specs de Playwright: se declaran como pruebas y no como codigo
# de produccion para que sus reglas y su deuda no se mezclen con las de la
# aplicacion.
sonar.tests=tests

# mockServiceWorker.js lo genera MSW y no se edita a mano; .next es salida de
# compilacion. Analizar cualquiera de los dos solo produce ruido.
sonar.exclusions=**/node_modules/**,**/.next/**,public/mockServiceWorker.js
